plugins { id 'com.android.application' }

android {
    namespace 'de.schulprojekt.tauchplaner'
    compileSdk 34
    defaultConfig {
        applicationId 'de.schulprojekt.tauchplaner'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('tauchplaner.keystore')
            storePassword 'tauchplaner'
            keyAlias 'tauchplaner'
            keyPassword 'tauchplaner'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
